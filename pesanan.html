<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Pesanan — Sarung Ende</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-sand/30 font-sans text-cocoa min-h-screen flex flex-col md:flex-row">

<!-- SIDEBAR (sama seperti dashboard) -->
<aside class="w-full md:w-64 bg-laut-deep text-ivory shrink-0 md:min-h-screen flex flex-col">
  <div class="p-6 border-b border-ivory/10 flex items-center gap-3">
    <span class="h-9 w-9 rounded-lg bg-emas flex items-center justify-center rotate-45"><span class="h-3 w-3 rounded-sm bg-laut-deep"></span></span>
    <div class="leading-tight">
      <span class="block font-serif text-lg font-bold">Sarung Ende</span>
      <span class="block text-[10px] font-extrabold tracking-widest text-emas uppercase">Seller Panel</span>
    </div>
  </div>

  <nav class="flex-1 p-4 space-y-1 text-sm font-semibold">
    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-ivory/10 transition"><i class="fa-solid fa-chart-pie w-5"></i> Ringkasan</a>
    <a href="dashboard.html#sec-produk" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-ivory/10 transition"><i class="fa-solid fa-boxes-stacked w-5"></i> Produk Saya</a>
    <a href="pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-emas text-laut-deep"><i class="fa-solid fa-receipt w-5"></i> Pesanan</a>
    <a href="#" onclick="showToast('💰 Keuangan — Tahap 9'); return false;" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-ivory/10 transition"><i class="fa-solid fa-wallet w-5"></i> Keuangan</a>
    <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-ivory/10 transition mt-8 border border-ivory/20"><i class="fa-solid fa-store w-5"></i> Lihat Toko</a>
  </nav>

  <div class="p-4 border-t border-ivory/10 text-xs">
    <div class="flex items-center gap-3 mb-3">
      <div id="user-avatar" class="h-8 w-8 rounded-full bg-emas text-laut-deep flex items-center justify-center font-bold">P</div>
      <div class="min-w-0">
        <p id="user-name" class="font-bold truncate">Penjual</p>
        <p id="user-email" class="text-ivory/50 truncate">email@seller.com</p>
      </div>
    </div>
    <button onclick="logout(); location.href='index.html'" class="w-full text-center py-2 rounded-lg bg-mengkudu/20 text-mengkudu-light hover:bg-mengkudu hover:text-ivory transition font-bold">
      <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
    </button>
  </div>
</aside>

<!-- KONTEN UTAMA -->
<main class="flex-1 p-6 md:p-10 overflow-y-auto">

  <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="font-serif text-3xl font-bold text-laut-deep">Kelola Pesanan</h1>
      <p class="text-sm text-cocoa/60">Semua pesanan dari pembeli Anda tercatat di sini.</p>
    </div>
    <button onclick="tambahPesananManual()" class="bg-laut text-ivory font-bold px-5 py-2.5 rounded-full hover:bg-laut-dark transition shadow-card text-sm">
      <i class="fa-solid fa-plus mr-2"></i> Input Pesanan Manual
    </button>
  </div>

  <!-- Tab Filter Status -->
  <div class="flex flex-wrap gap-2 mb-6">
    <button data-status="semua"      class="filter-status chip chip-active rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold">Semua <span id="cnt-semua" class="ml-1 bg-laut/10 text-laut rounded-full px-2 py-0.5 text-[10px]">0</span></button>
    <button data-status="menunggu"   class="filter-status chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold">Menunggu <span id="cnt-menunggu" class="ml-1 bg-emas/15 text-emas-dark rounded-full px-2 py-0.5 text-[10px]">0</span></button>
    <button data-status="dikemas"    class="filter-status chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold">Dikemas <span id="cnt-dikemas" class="ml-1 bg-mengkudu/10 text-mengkudu rounded-full px-2 py-0.5 text-[10px]">0</span></button>
    <button data-status="dikirim"    class="filter-status chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold">Dikirim <span id="cnt-dikirim" class="ml-1 bg-laut/10 text-laut rounded-full px-2 py-0.5 text-[10px]">0</span></button>
    <button data-status="selesai"    class="filter-status chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold">Selesai <span id="cnt-selesai" class="ml-1 bg-green-100 text-green-700 rounded-full px-2 py-0.5 text-[10px]">0</span></button>
  </div>

  <!-- Search -->
  <div class="mb-6">
    <input id="cari-pesanan" type="text" placeholder="Cari nomor invoice, nama pembeli, atau produk…"
           class="w-full rounded-full border border-cocoa/15 bg-white px-5 py-2.5 text-sm outline-none focus:border-emas">
  </div>

  <!-- Daftar Pesanan -->
  <div id="list-pesanan-full" class="space-y-4"></div>

  <!-- Kosong -->
  <div id="pesanan-kosong" class="hidden text-center py-20 bg-white rounded-2xl shadow-card">
    <i class="fa-solid fa-inbox text-5xl text-cocoa/30"></i>
    <h3 class="font-bold text-lg mt-4">Belum ada pesanan</h3>
    <p class="text-sm text-cocoa/55 mt-1">Pesanan baru akan muncul di sini begitu pembeli checkout.</p>
  </div>

</main>

<!-- Modal Detail Pesanan -->
<div id="modal-detail" class="hidden fixed inset-0 z-[80] bg-cocoa/60 items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-card w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="p-6 border-b border-cocoa/10 flex justify-between items-center">
      <h3 class="font-bold text-lg">Detail Pesanan</h3>
      <button onclick="tutupModal()" class="text-cocoa/50 hover:text-mengkudu"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div id="modal-body" class="p-6"></div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 z-[70]
     bg-laut-deep text-ivory text-sm font-bold px-6 py-3 rounded-full shadow-card pointer-events-none"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/pesanan.js"></script>
</body>
</html>
