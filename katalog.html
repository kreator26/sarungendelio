<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Katalog sarung tenun, kain ikat, selendang & kemeja tenun Ende–Lio.">
<title>Katalog Tenun — Sarung Ende</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-ivory font-sans text-cocoa">

<div id="site-header"></div>

<!-- ═══════════ BANNER HALAMAN ═══════════ -->
<section class="bg-laut-deep bg-motif-terang text-ivory pt-10 pb-20 px-4">
  <div class="max-w-7xl mx-auto">
    <p class="text-[11px] font-bold tracking-widest uppercase text-emas-light">
      <a href="index.html" class="hover:underline">Beranda</a> <span class="mx-1">/</span> Katalog
    </p>
    <h1 class="font-serif text-4xl md:text-5xl font-bold mt-2">Katalog Tenun Ende–Lio</h1>
    <p class="text-ivory/70 text-sm mt-2">Telusuri sarung, kain ikat, selendang, dan kemeja tenun berdasarkan motif & kategori.</p>
  </div>
</section>

<!-- ═══════════ TOOLBAR FILTER ═══════════ -->
<div class="max-w-7xl mx-auto px-4 -mt-10">
  <div class="bg-white rounded-2xl shadow-card p-5 space-y-4">

    <!-- Baris 1: pencarian + motif + urutan -->
    <div class="flex flex-col md:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-cocoa/40 text-sm"></i>
        <input id="cari" type="text" placeholder="Cari nama produk atau motif… (mis. naga, indigo)"
               class="w-full rounded-full border border-cocoa/15 bg-ivory/50 pl-10 pr-5 py-2.5 text-sm outline-none focus:border-emas">
      </div>
      <select id="motif" class="rounded-full border border-cocoa/15 bg-white px-4 py-2.5 text-sm font-semibold outline-none focus:border-emas">
        <option value="semua">Semua Motif</option>
        <option value="naga">Motif Naga</option>
        <option value="kuda">Motif Kuda (Ndara)</option>
        <option value="mata-manuk">Motif Mata Manuk</option>
        <option value="wela">Motif Bunga (Wela)</option>
        <option value="kupu">Motif Kupu-Kupu</option>
        <option value="geometris">Motif Geometris Lio</option>
      </select>
      <select id="urutkan" class="rounded-full border border-cocoa/15 bg-white px-4 py-2.5 text-sm font-semibold outline-none focus:border-emas">
        <option value="unggulan">Urutkan: Unggulan</option>
        <option value="harga-naik">Harga Terendah</option>
        <option value="harga-turun">Harga Tertinggi</option>
        <option value="rating">Rating Tertinggi</option>
        <option value="terlaris">Terlaris</option>
      </select>
    </div>

    <!-- Baris 2: chip kategori -->
    <div class="flex flex-wrap gap-2">
      <button data-kat="semua"    class="chip-kat chip chip-active rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold" onclick="pilihKat('semua')">Semua</button>
      <button data-kat="sarung"    class="chip-kat chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold" onclick="pilihKat('sarung')">Sarung Tenun</button>
      <button data-kat="kain"      class="chip-kat chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold" onclick="pilihKat('kain')">Kain Ikat</button>
      <button data-kat="selendang" class="chip-kat chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold" onclick="pilihKat('selendang')">Selendang & Lawe</button>
      <button data-kat="kemeja"    class="chip-kat chip rounded-full border border-cocoa/15 bg-white px-5 py-2 text-xs font-bold" onclick="pilihKat('kemeja')">Kemeja Tenun</button>
    </div>
  </div>
</div>

<!-- ═══════════ GRID KATALOG ═══════════ -->
<main class="max-w-7xl mx-auto px-4 py-10">
  <p id="info-hasil" class="text-sm text-cocoa/60 mb-6"></p>

  <div id="grid-katalog" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>

  <!-- Empty state -->
  <div id="katalog-kosong" class="hidden text-center py-20">
    <i class="fa-solid fa-box-open text-5xl text-cocoa/30"></i>
    <h3 class="font-bold text-lg mt-4">Tidak ada produk yang cocok</h3>
    <p class="text-sm text-cocoa/55 mt-1">Coba ubah kata kunci atau atur ulang filter.</p>
    <button onclick="resetFilter()" class="mt-5 rounded-full bg-laut text-ivory text-sm font-bold px-6 py-2.5 hover:bg-laut-dark transition">Atur Ulang Filter</button>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/katalog.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
